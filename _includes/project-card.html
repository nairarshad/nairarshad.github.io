<article class="project-card">
  <p class="project-kicker"><span>{{ include.project.order | prepend: '0' }}</span>{{ include.project.label }}</p>
  <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
  <p>{{ include.project.summary }}</p>
  <a class="text-link" href="{{ include.project.url | relative_url }}">Explore this research <span aria-hidden="true">↗</span></a>
</article>
